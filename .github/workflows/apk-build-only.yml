name: APK Build Verification

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-build:
    name: Debug + Release APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle wrapper and signing
        shell: bash
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android               -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048               -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -genkeypair -v -keystore ci-release.jks -storepass android -keypass android             -alias upload -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Ah Studio CI,O=Ah Studio,C=US"

      - name: Assemble Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ah-studio-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ah-studio-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          retention-days: 7
