name: AH Studio - Full Build Verification

on:
  push:
    branches: [ "main", "phase-9-repo-sync-build-verify" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test + Debug APK + Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Prepare Android build inputs
        shell: bash
        run: |
          touch .env .env.example
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v               -keystore debug.keystore               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Verify unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Verify debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare release signing key
        run: |
          keytool -genkeypair -v             -keystore ci-release.jks             -storepass android             -keypass android             -alias upload             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=AH Studio CI,O=AH Studio,C=US"

      - name: Verify release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ah-studio-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ah-studio-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 7
