name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Prepare Debug Keystore & Secrets
      run: |
        touch .env .env.example
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        if [ ! -f "gradlew" ]; then gradle wrapper; fi
        chmod +x ./gradlew

    - name: Build Debug APK
      env:
        GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Xmx3072m"
      run: ./gradlew assembleDebug --stacktrace -x test

    - name: Prepare CI Release Signing Key
      run: |
        keytool -genkeypair -v -keystore ci-release.jks -storepass android -keypass android \
          -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Ah Studio CI,O=Ah Studio,C=US"

    - name: Build Release APK
      env:
        GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Xmx3072m"
        KEYSTORE_PATH: ${{ github.workspace }}/ci-release.jks
        STORE_PASSWORD: android
        KEY_PASSWORD: android
      run: ./gradlew assembleRelease --stacktrace -x test

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ah-studio-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        retention-days: 14

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ah-studio-release-apk
        path: "**/build/outputs/apk/release/*.apk"
        retention-days: 14
