name: Build Android APK

on:
  push:
    branches: [ "main", "master", "phase-7-professional-export-rendering" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Phase 7 Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Locate Project & Build
        run: |
          TARGET_DIR="."
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            FOUND_DIR=$(find . -maxdepth 2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)
            if [ -n "$FOUND_DIR" ]; then TARGET_DIR="$FOUND_DIR"; fi
          fi
          cd "$TARGET_DIR"
          touch .env.example .env
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Build unsigned release APK
        run: |
          cd "${TARGET_DIR:-.}"
          ./gradlew assembleRelease --stacktrace -Pandroid.injected.signing.store.file=/tmp/nonexistent
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
