name: Build Android APK

on:
  push:
    branches: [ "main", "master", "phase-6-professional-export" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Integrate Phase 6 Export Engine
        run: |
          python3 scripts/integrate_phase6_export.py
          if ! git diff --quiet -- app/src/main/java/com/example/ui/StudioViewModel.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/ui/StudioViewModel.kt
            git commit -m "Phase 6: integrate professional export engine"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Locate Project & Build APK
        run: |
          TARGET_DIR="."
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ] && [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            FOUND_DIR=$(find . -maxdepth 2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)
            if [ -n "$FOUND_DIR" ]; then
              TARGET_DIR="$FOUND_DIR"
            fi
          fi
          cd "$TARGET_DIR"
          touch .env.example
          touch .env
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
