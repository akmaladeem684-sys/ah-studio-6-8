name: Phase 4 Gap Fix

on:
  push:
    branches: [phase4-gap-completion]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Phase 4 effect integration
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/example/engine/composition/VideoCompositionEngine.kt")
          text = path.read_text()

          old_import = "import com.example.engine.KeyframeInterpolator\n"
          new_import = old_import + "import com.example.engine.composition.Phase4EffectParameterEngine\n"
          if "Phase4EffectParameterEngine" not in text:
              text = text.replace(old_import, new_import, 1)

          old_eval = """        val relTime = (posMs - clip.timelineStartMs).coerceAtLeast(0L)\n        val intensity = KeyframeInterpolator.interpolateEffectIntensity(clip, relTime)\n        ComposedEffect("""
          new_eval = """        val relTime = (posMs - clip.timelineStartMs).coerceAtLeast(0L)\n        val intensity = Phase4EffectParameterEngine.evaluateIntensity(clip, posMs)\n        ComposedEffect("""
          if old_eval not in text:
              raise SystemExit("Expected Phase 4 effect evaluation block was not found")
          text = text.replace(old_eval, new_eval, 1)

          old_matrix = """    if (activeEffects.isNotEmpty()) {\n      val effectMat = VideoEffectRenderer.calculateEffectColorMatrix(activeEffects.map { it.clip }, posMs)\n      if (effectMat != null) {"""
          new_matrix = """    if (activeEffects.isNotEmpty()) {\n      val evaluatedEffects = activeEffects.map { effect ->\n        effect.clip.copy(intensity = effect.intensity.coerceIn(0f, 1f))\n      }\n      val effectMat = VideoEffectRenderer.calculateEffectColorMatrix(evaluatedEffects, posMs)\n      if (effectMat != null) {"""
          if old_matrix not in text:
              raise SystemExit("Expected Phase 4 color matrix block was not found")
          text = text.replace(old_matrix, new_matrix, 1)

          old_motion = """        val motion = VideoEffectRenderer.calculateMotionTransform(frame.activeEffects.map { it.clip }, frame.timelinePosMs)"""
          new_motion = """        val evaluatedEffects = frame.activeEffects.map { effect ->\n          effect.clip.copy(intensity = effect.intensity.coerceIn(0f, 1f))\n        }\n        val motion = VideoEffectRenderer.calculateMotionTransform(evaluatedEffects, frame.timelinePosMs)"""
          if old_motion not in text:
              raise SystemExit("Expected Phase 4 motion block was not found")
          text = text.replace(old_motion, new_motion, 1)

          path.write_text(text)

      - name: Add Phase 4 integration regression test
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/test/java/com/example/Phase4CompositionIntegrationTest.kt")
          path.write_text(r'''package com.example

import androidx.test.core.app.ApplicationProvider
import com.example.domain.model.ClipKeyframe
import com.example.domain.model.EffectClip
import com.example.domain.model.EffectType
import com.example.domain.model.KeyframeInterpolation
import com.example.domain.model.Timeline
import com.example.engine.composition.VideoCompositionEngine
import org.junit.Assert.assertEquals
import org.junit.Assert.assertEquals as assertFloatEquals
import org.junit.Assert.assertTrue
import org.junit.Test
import org.junit.runner.RunWith
import org.robolectric.RobolectricTestRunner
import org.robolectric.annotation.Config

@RunWith(RobolectricTestRunner::class)
@Config(sdk = [34])
class Phase4CompositionIntegrationTest {

  @Test
  fun animatedEffectParameterReachesComposedFrame() {
    val effect = EffectClip(
      id = "effect_1",
      effectType = EffectType.GLOW,
      timelineStartMs = 1_000L,
      durationMs = 2_000L,
      intensity = 0.2f,
      keyframes = listOf(
        ClipKeyframe(timeMs = 0L, effectParam = 0.1f),
        ClipKeyframe(timeMs = 2_000L, effectParam = 0.9f)
      )
    )

    val timeline = Timeline(effectClips = listOf(effect))
    val engine = VideoCompositionEngine(ApplicationProvider.getApplicationContext())
    val frame = engine.evaluateFrame(timeline, 2_000L)

    assertEquals(1, frame.activeEffects.size)
    assertFloatEquals(0.5f, frame.activeEffects.single().intensity, 0.0001f)
  }

  @Test
  fun holdEffectKeyframeRemainsStableInComposition() {
    val effect = EffectClip(
      id = "effect_hold",
      effectType = EffectType.GLOW,
      timelineStartMs = 0L,
      durationMs = 1_000L,
      keyframes = listOf(
        ClipKeyframe(timeMs = 0L, effectParam = 0.25f, interpolation = KeyframeInterpolation.HOLD),
        ClipKeyframe(timeMs = 1_000L, effectParam = 1f)
      )
    )

    val frame = VideoCompositionEngine(ApplicationProvider.getApplicationContext())
      .evaluateFrame(Timeline(effectClips = listOf(effect)), 500L)

    assertEquals(1, frame.activeEffects.size)
    assertFloatEquals(0.25f, frame.activeEffects.single().intensity, 0.0001f)
    assertTrue(frame.activeEffects.single().progress in 0f..1f)
  }
}
''')

      - name: Verify patch
        run: |
          grep -q 'Phase4EffectParameterEngine.evaluateIntensity' app/src/main/java/com/example/engine/composition/VideoCompositionEngine.kt
          grep -q 'effect.clip.copy(intensity' app/src/main/java/com/example/engine/composition/VideoCompositionEngine.kt
          test -f app/src/test/java/com/example/Phase4CompositionIntegrationTest.kt

      - name: Commit Phase 4 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/engine/composition/VideoCompositionEngine.kt app/src/test/java/com/example/Phase4CompositionIntegrationTest.kt
          git commit -m "fix: integrate Phase 4 animated effect parameters" || exit 0
          git push